services:
  postgres:
    image: postgres:15-alpine
    container_name: api-monitor-postgres
    environment:
      POSTGRES_DB: api_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: deep
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    networks:
      - api-monitor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6.0
    container_name: api-monitor-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - api-monitor-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: api-monitor-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: api_monitor
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - api-monitor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:7
    container_name: api-monitor-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: deep
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - api-monitor-network
    restart: unless-stopped
    depends_on:
      - postgres

  api-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-monitoring-app
    environment:
      NODE_ENV: production
      PORT: 5000

      # MongoDB
      MONGO_URI: mongodb://mongo:27017/api_monitor
      MONGO_DB_NAME: api_monitor

      # PostgreSQL (MATCHED)
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: api_monitor
      PG_USER: postgres
      PG_PASSWORD: deep

      # RabbitMQ (MATCHED)
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/api_monitor
      RABBITMQ_QUEUE: api_hits

      # Security
      JWT_SECRET: your_secret_key
      JWT_EXPIRES_IN: 24h

      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100

    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
    networks:
      - api-monitor-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # consumer:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.consumer
  #   container_name: api-monitoring-consumer
  #   environment:
  #     NODE_ENV: production

  #     # MongoDB
  #     MONGO_URI: mongodb://mongo:27017/api_monitor
  #     MONGO_DB_NAME: api_monitor

  #     # PostgreSQL (MATCHED)
  #     PG_HOST: postgres
  #     PG_PORT: 5432
  #     PG_DATABASE: api_monitor
  #     PG_USER: postgres
  #     PG_PASSWORD: deep

  #     # RabbitMQ (MATCHED)
  #     RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/api_monitor
  #     RABBITMQ_QUEUE: api_hits

  #     # Security
  #     JWT_SECRET: your_secret_key

  #   volumes:
  #     - ./logs:/app/logs
  #   networks:
  #     - api-monitor-network
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  rabbitmq_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  api-monitor-network:
    driver: bridge